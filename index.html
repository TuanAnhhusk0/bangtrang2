<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảng trắng · Toán 11</title>
<meta name="description" content="Bảng trắng dạy học Toán 11: bút cảm ứng, tự nắn hình, hình học động, thước kẻ, êke, compa, công thức, đồ thị hàm số, hình mẫu không gian, viết lên PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6ecf4;--surface:#ffffff;--surface-2:#f1f5fa;--ink:#132033;--ink-2:#3a4b61;--muted:#66788f;
  --line:#d6dfea;--line-2:#bccadb;--acc:#5b4bd1;--acc-soft:#ece9fc;--acc-line:#cbc4f4;--acc-ink:#ffffff;--danger:#d3343c;
  --shadow:0 8px 28px rgba(15,30,60,.16);
  --font:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --math:"Noto Serif","Cambria","Times New Roman",Times,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1422;--surface:#131e30;--surface-2:#1a2840;--ink:#e6eef8;--ink-2:#b8c7da;--muted:#8a9bb2;
  --line:#24344d;--line-2:#34486a;--acc:#a99dff;--acc-soft:#262150;--acc-line:#4a4390;--acc-ink:#120c36;--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1422;--surface:#131e30;--surface-2:#1a2840;--ink:#e6eef8;--ink-2:#b8c7da;--muted:#8a9bb2;
  --line:#24344d;--line-2:#34486a;--acc:#a99dff;--acc-soft:#262150;--acc-line:#4a4390;--acc-ink:#120c36;--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;overflow:hidden;display:grid;grid-template-rows:auto auto minmax(0,1fr);height:100vh;height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- thanh trên ---- */
.top,.props{display:flex;align-items:center;gap:.25rem;padding:.28rem .5rem;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap;min-height:46px}
.top::-webkit-scrollbar,.props::-webkit-scrollbar{display:none}
.top .brand{display:flex;flex-direction:column;line-height:1.1;margin-right:.35rem}
.top .brand b{font-size:.92rem}
.top .brand span{font-size:.64rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sp{flex:1 1 auto;min-width:.4rem}
.sep{width:1px;align-self:stretch;background:var(--line);margin:.15rem .2rem;flex:0 0 auto}
.lab{font-size:.72rem;color:var(--muted);margin:0 .1rem 0 .2rem}
.tb{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink-2);cursor:pointer;padding:0;flex:0 0 auto;position:relative}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.tb:hover{background:var(--surface-2);color:var(--ink)}
.tb[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.tb:disabled{opacity:.35;cursor:not-allowed}
.tb.tx{width:auto;padding:0 .55rem;gap:.35rem;display:inline-flex;align-items:center;font-size:.8rem;font-weight:600}
.tb.tx svg{width:19px;height:19px}
.tb .kb{position:absolute;right:2px;bottom:1px;font-size:.55rem;color:var(--muted);font-weight:700;line-height:1}
.zoomv{min-width:3.8em;text-align:center;font-size:.8rem;font-variant-numeric:tabular-nums;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:.2rem .3rem;cursor:pointer}
.pgv{font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:4.6em;text-align:center}

/* ---- thanh thuộc tính ---- */
.props{min-height:44px;background:var(--surface-2)}
@media (min-width:761px){.props{flex-wrap:wrap;overflow:visible;row-gap:.3rem}}
.pbtn[hidden],.tb[hidden],.chk[hidden],.seg[hidden],.wbtn[hidden]{display:none!important}
.props .g{display:inline-flex;align-items:center;gap:.25rem;flex:0 0 auto}
.props .g[hidden]{display:none}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);cursor:pointer;padding:0;flex:0 0 auto}
.sw[aria-pressed="true"]{outline:3px solid var(--acc);outline-offset:2px}
.cpick{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer;flex:0 0 auto}
.wbtn{width:34px;height:30px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 auto}
.wbtn i{display:block;width:18px;border-radius:9px;background:var(--ink)}
.wbtn[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;border-right:1px solid var(--line-2);background:var(--surface);padding:.28rem .55rem;font-size:.76rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:.25rem}
.seg button:last-child{border-right:0}
.seg button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);font-weight:600}
.chk{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;border:1px solid var(--line-2);border-radius:999px;padding:.22rem .65rem;background:var(--surface);cursor:pointer;flex:0 0 auto}
.chk[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.chk svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pbtn{font-size:.78rem;border:1px solid var(--line-2);border-radius:8px;padding:.25rem .6rem;background:var(--surface);cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;gap:.3rem}
.pbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pbtn:hover{border-color:var(--acc)}
.pbtn.danger{color:var(--danger)}
.pinfo{font-size:.76rem;color:var(--muted);flex:0 0 auto}

/* ---- vùng làm việc ---- */
.top{grid-row:1}.props{grid-row:2}
.work{grid-row:3;display:grid;grid-template-columns:auto minmax(0,1fr) auto;min-height:0}
.rail{display:grid;grid-template-columns:repeat(2,38px);align-content:start;gap:2px;padding:.3rem;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.rail .grp{grid-column:1/-1;font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;margin:.4rem 0 .05rem;font-weight:700}
.rail .grp:first-child{margin-top:.1rem}
.vp{position:relative;overflow:hidden;touch-action:none;background:var(--bg);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none}
.vp.c-cross{cursor:crosshair}.vp.c-sel{cursor:default}.vp.c-move{cursor:move}.vp.c-hand{cursor:grab}.vp.c-pan{cursor:grabbing}.vp.c-text{cursor:text}.vp.c-none{cursor:none}.vp.c-nwse{cursor:nwse-resize}.vp.c-nesw{cursor:nesw-resize}.vp.c-ew{cursor:ew-resize}.vp.c-ns{cursor:ns-resize}.vp.c-rot{cursor:alias}.vp.c-ptr{cursor:pointer}
#sv{position:absolute;left:0;top:0;overflow:visible;box-shadow:0 4px 30px rgba(15,30,60,.2);pointer-events:none}
#sv text{user-select:none}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(20,30,50,.86);color:#fff;font-size:.78rem;padding:.32rem .8rem;border-radius:999px;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:6}
.hint:empty{display:none}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:.8rem;padding:.38rem .9rem;border-radius:10px;z-index:8;box-shadow:var(--shadow);transition:opacity .3s}
.toast[hidden]{display:block;opacity:0;pointer-events:none}

/* ---- đối tượng trên trang ---- */
.lab-s{font-family:var(--math);font-style:italic;font-weight:600;paint-order:stroke;stroke-width:5px;stroke-linejoin:round}
.txt-s{font-family:var(--font);paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.it{display:inline-block;font-family:var(--font);line-height:1.32;white-space:pre;font-weight:500;padding:0 .06em;width:max-content}
.it.note{background:#fff3a0;border:1px solid #e3c93a;box-shadow:0 4px 12px rgba(60,50,0,.18);padding:.35em .6em;border-radius:5px;color:#3b2e00!important;white-space:pre-wrap;max-width:15em}
.it-math{white-space:nowrap;padding:.05em .12em}
.it .ML__latex{font-size:1em}
#meas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.laser{fill:none;stroke:#ff2b2b;stroke-linecap:round;stroke-linejoin:round;opacity:.95;transition:opacity .8s ease}
.laser.fade{opacity:0}
.ted{position:absolute;z-index:7;border:2px dashed var(--acc);background:rgba(255,255,255,.97);font-family:var(--font);font-weight:500;line-height:1.32;resize:none;overflow:hidden;outline:none;white-space:pre;padding:0 .06em;margin:0;color:#132033;min-width:4em;border-radius:4px}
.ted.note{background:#fff3a0;white-space:pre-wrap}
.ren{position:absolute;z-index:7;width:5.5em;font:600 18px var(--math);font-style:italic;border:2px solid var(--acc);border-radius:6px;padding:.1rem .3rem;background:#fff;color:#132033;outline:none}

/* ---- thanh trang (bên phải) ---- */
.side{width:196px;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-h{display:flex;align-items:center;gap:.15rem;padding:.35rem .4rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.side-h b{font-size:.82rem;margin-right:auto}
.side-h .tb{width:30px;height:30px}
.side-h .tb svg{width:18px;height:18px}
.side-h .sideclose{display:none}
.thumbs{flex:1;overflow-y:auto;padding:.5rem .55rem;display:flex;flex-direction:column;gap:.55rem;scrollbar-width:thin}
.th{display:block;position:relative;border:2px solid var(--line);border-radius:8px;background:#fff;padding:0;cursor:pointer;overflow:hidden;flex:0 0 auto}
.th svg{display:block;width:100%;height:auto}
.th .n{position:absolute;left:4px;top:3px;font-size:.66rem;font-weight:700;background:rgba(20,30,50,.72);color:#fff;border-radius:5px;padding:0 .35rem}
.th[aria-current="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc-line)}
.side-f{border-top:1px solid var(--line);padding:.45rem .5rem .55rem;display:flex;flex-direction:column;gap:.35rem}
.side-f .lab{margin:0}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:.25rem}
.bgs button{border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:.66rem;padding:.2rem .1rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.1rem}
.bgs button svg{width:100%;height:24px;border-radius:4px}
.bgs button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft);font-weight:600}
.side-f select{border:1px solid var(--line-2);border-radius:7px;padding:.2rem .3rem;background:var(--surface);font-size:.76rem}

/* ---- hộp thoại ---- */
.dlg{position:fixed;inset:0;z-index:90;background:rgba(10,20,40,.45);display:grid;place-items:center;padding:12px}
.dlg-box{background:var(--surface);color:var(--ink);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.35);width:min(860px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.dlg-head{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border-bottom:1px solid var(--line)}
.dlg-head b{font-size:.95rem}
.dlg-head .st{font-size:.74rem;color:var(--muted);flex:1}
.dlg-body{padding:.7rem .85rem;overflow:auto;display:flex;flex-direction:column;gap:.55rem}
.dlg-foot{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;padding:.55rem .8rem;border-top:1px solid var(--line)}
.btn{font-size:.85rem;border-radius:10px;padding:.42rem .9rem;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.mtabs{display:flex;gap:.25rem;flex-wrap:wrap;padding:.45rem .7rem 0}
.mtabs button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:.15rem .65rem;font-size:.76rem;cursor:pointer}
.mtabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.mpal{display:flex;flex-wrap:wrap;gap:.3rem;padding:.5rem .7rem;max-height:30vh;overflow:auto;border-bottom:1px solid var(--line)}
.mpal button{min-width:42px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);cursor:pointer;font-family:var(--math);font-size:1.05rem;padding:0 .45rem}
.mpal button:hover{border-color:var(--acc);background:var(--acc-soft)}
.mpal button.w{font-family:var(--font);font-size:.78rem}
.dlg math-field{font-size:1.6rem;min-height:2.2em;border:2px solid var(--acc-line);border-radius:10px;padding:.2rem .5rem;background:#fff;color:#132033;display:block;width:100%}
.dlg math-field:focus-within{border-color:var(--acc)}
.dlg textarea,.dlg input[type=text]{font:1rem/1.4 Consolas,"Courier New",monospace;border:2px solid var(--acc-line);border-radius:10px;padding:.4rem .6rem;width:100%;background:#fff;color:#132033}
.dlg textarea{min-height:4.2em;resize:vertical}
.mprev{min-height:2.4em;font-size:1.5rem;padding:.3rem .5rem;border:1px dashed var(--line-2);border-radius:10px;background:#fff;color:#132033;overflow:auto}
.help{font-size:.74rem;color:var(--muted);margin:0}
.err{font-size:.8rem;color:var(--danger);margin:0;min-height:1.1em}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chips button{border:1px solid var(--line-2);border-radius:999px;background:var(--surface-2);padding:.15rem .6rem;font-size:.8rem;cursor:pointer;font-family:Consolas,monospace}
.fnlist{display:flex;flex-direction:column;gap:.3rem}
.fnrow{display:flex;gap:.4rem;align-items:center}
.tpl-g h4{margin:.4rem 0 .35rem;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:.45rem}
.tpls button{display:flex;flex-direction:column;align-items:center;gap:.2rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:.35rem;cursor:pointer;font-size:.72rem}
.tpls button:hover{border-color:var(--acc);background:var(--acc-soft)}
.tpls svg{width:100%;height:auto;aspect-ratio:4/3;background:#fff;border-radius:6px}
.pform{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem .9rem}
.pform label,.dlg label.wide{display:flex;flex-direction:column;gap:.2rem;font-size:.8rem;color:var(--ink-2)}
.dlg input[type=number]{font:1rem/1.4 inherit;border:2px solid var(--acc-line);border-radius:10px;padding:.35rem .6rem;width:100%;background:#fff;color:#132033}
.dlg input.sm{width:6.5em;flex:0 0 auto}
.dlg select{border:2px solid var(--acc-line);border-radius:10px;padding:.35rem .5rem;background:var(--surface);color:var(--ink);font-size:.9rem;width:auto;max-width:100%}
.ckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.35rem 1rem}
.chkl{display:flex;align-items:center;gap:.45rem;font-size:.85rem;cursor:pointer}
.pprev{display:flex;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:10px;min-height:120px}
.pprev svg{width:min(420px,100%);height:auto;max-height:300px}
.dlg h4.sub{margin:.4rem 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.exrows{display:flex;flex-direction:column;gap:.3rem}
.exrows span{font-size:.8rem;color:var(--muted)}
.props input[type=range]{width:120px;accent-color:var(--acc)}
.props output{font-size:.76rem;min-width:2.8em;font-variant-numeric:tabular-nums}
.bbtE{overflow-x:auto;border:1px solid var(--line);border-radius:10px;padding:.4rem}
.bbtE table{border-collapse:collapse}
.bbtE td{padding:.2rem .25rem;vertical-align:middle;white-space:nowrap}
.bbtE td:first-child input{width:3.4em;font-style:italic;font-family:var(--math);text-align:center}
.bbtE td.nd{background:var(--surface-2);border-radius:6px}
.bbtE td.iv{min-width:3em;text-align:center}
.bbtE input{font:.95rem/1.3 var(--font);border:1px solid var(--line-2);border-radius:7px;padding:.2rem .35rem;width:5.6em;background:#fff;color:#132033}
.bbtE select{font-size:.8rem;border:1px solid var(--line-2);border-radius:7px;padding:.15rem .2rem;background:var(--surface);color:var(--ink);margin-left:.15rem}
.bbtE .sep2{font-size:.72rem;color:var(--muted);margin:0 .2rem 0 .4rem}
.gprev{border:1px solid var(--line);border-radius:10px;background:#fff;color:#132033;padding:.6rem .8rem;overflow:auto;max-height:46vh}
.gtab{border-collapse:collapse;margin-bottom:.6rem;font-size:.9rem}
.gtab th,.gtab td{border:1px solid #9fb0c8;padding:.25rem .55rem;text-align:center;white-space:nowrap}
.gtab th{background:#eef3fa;text-align:left}
.glines div{margin:.25rem 0;font-size:1rem;line-height:1.6}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.2rem 1.2rem;font-size:.82rem}
.keys div{display:flex;justify-content:space-between;gap:.6rem;border-bottom:1px dashed var(--line);padding:.18rem 0}
kbd{display:inline-block;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 .35em;font-size:.78em;background:var(--surface-2);font-family:inherit}
.helpc h3{font-size:.85rem;margin:.6rem 0 .25rem}
.helpc ul{margin:.1rem 0;padding-left:1.1rem;font-size:.82rem;line-height:1.5}

/* ---- kí hiệu toán dự phòng (khi chưa tải được bộ công thức) ---- */
.m{font-family:var(--math);white-space:nowrap}
.m i{font-style:italic}
.m sub,.m sup{font-size:.7em;line-height:0}
.ss{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.7em;line-height:1.05}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.15;font-size:.95em}
.fr>span{display:block;padding:0 .18em}
.fr>span:first-child{border-bottom:1.3px solid currentColor}
.sq{display:inline-flex;align-items:stretch}
.sq>span{border-top:1.3px solid currentColor;padding:0 .1em;margin-top:.12em}
.hat{position:relative;display:inline-block}
.hat::before{content:"";position:absolute;left:8%;right:8%;top:-.12em;height:.32em;border-top:1.3px solid currentColor;border-radius:50% 50% 0 0}
.vec{position:relative;display:inline-block;padding-top:.34em;line-height:1}
.vec::before{content:"";position:absolute;left:.12em;right:.06em;top:.22em;border-top:.075em solid currentColor}
.vec::after{content:"";position:absolute;right:.1em;top:.12em;width:.17em;height:.17em;border-top:.075em solid currentColor;border-right:.075em solid currentColor;transform:rotate(45deg)}
.ovl{text-decoration:overline;text-decoration-thickness:.07em}
.sys{display:inline-flex;align-items:center;vertical-align:middle;margin:.15em .1em}
.sys .sbr{font-style:normal;font-weight:300;line-height:1;transform:scaleX(.55);margin-right:-.05em;font-family:var(--math)}
.sys .sl{display:inline-flex;flex-direction:column;line-height:1.3}

/* ---- thu gọn giao diện (trình chiếu) ---- */
.zbar{position:fixed;right:12px;bottom:12px;z-index:30;display:none;gap:.2rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.25rem;box-shadow:var(--shadow);align-items:center}
body.zen{grid-template-rows:0 0 minmax(0,1fr)}
body.zen .top,body.zen .props,body.zen .side{display:none}
body.zen .zbar{display:flex}
body.zen .rail{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:30;max-height:calc(100vh - 24px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
body.zen .work{grid-template-columns:minmax(0,1fr)}
body.noside .side{display:none}

/* ---- điện thoại, màn hẹp ---- */
@media (max-width:760px){
  .top .brand{display:none}
  .tb{width:36px;height:36px}
